[project]
name = "edge-agent-scanner"
version = "0.2.0"
description = "Agent-aware static scanner for AI-agent repositories"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0.1",
  "packaging>=24.0",
  "libcst>=1.4.0",
  "tree-sitter>=0.22.0",
  "tree-sitter-language-pack>=0.7.0",
  "openapi-spec-validator>=0.7.1",
  "networkx>=3.2; python_version >= '3.10'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6.0", "mypy>=1.8"]
external = ["semgrep>=1.80.0"]

[project.scripts]
edge-agent-scan = "edge_agent_scanner.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
