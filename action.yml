# Edge Agent AI — Policy Gate (Composite Action)
#
# Lets a downstream repo run the policy gate in two lines instead of
# six. Usage (in another repo's workflow):
#
#   - uses: actions/checkout@v4
#     with: { fetch-depth: 0 }
#   - uses: <org>/edge-agent-ai@v1
#     with:
#       policy-file: .edgeagent/policy.yaml   # optional
#       base-ref: ${{ github.base_ref }}      # optional
#
# When that repo also depends on the rest of Edge Agent AI (e.g. for
# the desktop app) you can pin the action to a tagged release. For
# now this is intended to be consumed from this very repository, but
# the layout is the same once a tag is cut.

name: "Edge Agent AI Policy Gate"
description: "Run static scan + policy evaluation on every PR / push."
author: "Edge Agent AI"

inputs:
  policy-file:
    description: "Path to .edgeagent/policy.yaml, relative to repo root."
    required: false
    default: ".edgeagent/policy.yaml"
  base-ref:
    description: >-
      Base ref to scan for delta comparison. Defaults to
      origin/${{ github.base_ref }} on pull_request events, none
      otherwise.
    required: false
    default: ""
  python-version:
    description: "Python version for the scanner."
    required: false
    default: "3.11"
  node-version:
    description: "Node version for the policy CLI."
    required: false
    default: "20"
  post-comment:
    description: "Post a sticky PR comment with the report."
    required: false
    default: "true"
  fail-on-block:
    description: >-
      When 'true' (default), a BLOCK decision in block mode fails the
      step. Set to 'false' to make the gate observation-only.
    required: false
    default: "true"

outputs:
  decision:
    description: "Final policy decision: pass | warn | block."
    value: ${{ steps.gate.outputs.decision }}
  risk-score:
    description: "Risk score of the target scan."
    value: ${{ steps.gate.outputs.risk_score }}
  failed-count:
    description: "Number of failed policy conditions."
    value: ${{ steps.gate.outputs.failed_count }}
  report-path:
    description: "Path to the Markdown policy report."
    value: ${{ steps.gate.outputs.report_path }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Edge Agent scanner
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e "${{ github.action_path }}/scanner"

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9
        run_install: false

    - name: Install Node dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --frozen-lockfile

    - name: Run policy gate
      id: gate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
      run: |
        BASE_ARG=""
        if [ -n "${{ inputs.base-ref }}" ]; then
          BASE_ARG="--base ${{ inputs.base-ref }}"
        fi
        pnpm --dir "${{ github.action_path }}" tsx scripts/policy-gate.ts \
          --repo "$GITHUB_WORKSPACE" \
          --policy-file "${{ inputs.policy-file }}" \
          --post-comment "${{ inputs.post-comment }}" \
          $BASE_ARG || EXIT_CODE=$?
        if [ "${{ inputs.fail-on-block }}" = "false" ]; then
          exit 0
        fi
        exit ${EXIT_CODE:-0}
