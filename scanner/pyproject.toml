[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-agent-scanner"
version = "0.2.0"
description = "Agent-aware static scanner for AI-agent repositories (Edge Agent AI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0.1",
  "packaging>=24.0",
  "libcst>=1.4.0",
  "tree-sitter>=0.22.0",
  "tree-sitter-language-pack>=0.7.0",
  "openapi-spec-validator>=0.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
  "mypy>=1.8",
]
external = [
  "semgrep>=1.80.0",
]

[project.scripts]
# Keep `edge-agent-scanner` as the canonical entry point. `edge-agent-scan` is
# kept as a convenience alias matching docs in new_changes/ — both resolve to
# the same CLI main().
edge-agent-scanner = "edge_agent_scanner.cli:main"
edge-agent-scan = "edge_agent_scanner.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"edge_agent_scanner.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
